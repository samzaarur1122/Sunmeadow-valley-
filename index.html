export function createGame(now=Date.now()) {

export function loadGame(storage=undefined,now=Date.now()) {

}
export function saveGame(s,storage=undefined,now=Date.now()){s.updatedAt=now;try{storage=storage??globalThis.localStorage;storage?.setItem(SAVE_KEY,JSON.stringify(s));return true}catch{return false}}
export const inventoryCount=s=>Object.values(s.inventory).reduce((a,b)=>a+(Number.isFinite(b)?b:0),0);
export const hasItems=(s,items)=>Object.entries(items).every(([key,num])=>(s.inventory[key]||0)>=num);
export const costItems=(s,items)=>{if(!hasItems(s,items))return false;for(const [key,num] of Object.entries(items))s.inventory[key]-=num;return true};
export const addItem=(s,item,num)=>{if(inventoryCount(s)+num>s.storage)return false;s.inventory[item]=(s.inventory[item]||0)+num;return true};
export function earnXp(s,amount){s.xp+=amount;let levels=0;while(s.xp>=levelNeed(s.level)){s.xp-=levelNeed(s.level);s.level++;s.coins+=75+s.level*25;levels++}return levels}
export function priceAt(s,item,now=Date.now()) {const base=ITEMS[item]?.price||10;const t=Math.floor(now/90000);let hash=0;for(const c of item)hash=hash*31+c.charCodeAt(0);return Math.max(1,Math.round(base*(.85+Math.sin(t*.7+hash)*.16+Math.cos(t*.21+hash*.03)*.08)))}
export const ok=(msg,details={})=>({ok:true,message:msg,...details});
export const fail=msg=>({ok:false,message:msg});
export function plant(s,plotId,crop,now=Date.now()){
  const p=s.plots[plotId],c=CROPS[crop];if(!p||!p.unlocked)return fail('Unlock this field first!');if(p.crop)return fail('This field already has a crop.');if(!c)return fail('Unknown crop.');if(s.level<c.level)return fail(`Reach level ${c.level} to grow ${c.name}.`);if(!costItems(s,{[crop]:1}))return fail(`Need ${c.name.toLowerCase()} to plant. Buy some at the market.`);
  Object.assign(p,{crop,plantedAt:now,duration:c.grow,watered:false,fertilized:false});s.stats.plant++;return ok(`${c.emoji} Planted ${c.name.toLowerCase()}!`,{xp:0});
}
export const growFraction=(p,now=Date.now())=>p.crop?Math.min(1,Math.max(0,(now-p.plantedAt)/p.duration)):0;
export function harvest(s,plotId,now=Date.now()){
  const p=s.plots[plotId];if(!p?.crop)return fail('Nothing to harvest here.');if(growFraction(p,now)<1)return fail(`Not quite ready — ${fmtTime(p.plantedAt+p.duration-now)} left.`);
  const c=CROPS[p.crop],qty=c.yield+(p.fertilized?1:0),type=p.crop;
  if(!addItem(s,type,qty))return fail('Barn is full! Sell goods or upgrade your storage.');
  Object.assign(p,{crop:null,plantedAt:0,duration:0,watered:false,fertilized:false});s.stats.harvest+=qty;const levelUps=earnXp(s,c.xp);return ok(`+${qty} ${c.name} · +${c.xp} XP`,{quantity:qty,item:type,xp:c.xp,levelUps});
}
export function water(s,plotId,now=Date.now()){
  const p=s.plots[plotId];if(!p?.crop)return fail('Plant something here first.');if(p.watered)return fail('Already watered!');if(growFraction(p,now)>=1)return fail('Already grown — time to harvest.');
  const remaining=p.plantedAt+p.duration-now; p.plantedAt-=remaining*.32;p.watered=true;s.stats.water++;return ok('💧 Watered! Growing 32% faster.');
}
export function rushPlot(s,plotId,now=Date.now()){
  const p=s.plots[plotId];if(!p?.crop)return fail('Nothing growing here.');if(growFraction(p,now)>=1)return fail('This crop is already ready.');if(s.gems<1)return fail('Not enough gems.');s.gems--;p.plantedAt=now-p.duration;return ok('⚡ Instant harvest ready! 1 gem used.');
}
export function fertilize(s,plotId){const p=s.plots[plotId];if(!p?.crop)return fail('Plant something here first.');if(p.fertilized)return fail('Already fertilized!');if(s.coins<15)return fail('Need 15 coins for a growth boost.');s.coins-=15;s.stats.spent+=15;p.fertilized=true;return ok('✨ Boost applied! +1 at harvest.');}
export function buyPlot(s,plotId){const p=s.plots[plotId];if(!p)return fail('Field not found.');if(p.unlocked)return fail('This field is already yours!');const req=1+Math.floor(plotId/8),cost=85+Math.floor(plotId/6)*80;if(s.level<req)return fail(`Reach level ${req} to unlock this field.`);if(s.coins<cost)return fail(`You need ${cost} coins.`);s.coins-=cost;s.stats.spent+=cost;p.unlocked=true;return ok(`New field unlocked! −${cost} coins`);}
export const plotPrice=id=>85+Math.floor(id/6)*80;
export const plotLevel=id=>1+Math.floor(id/8);
export function sell(s,item,amount=1,now=Date.now()) {if(!ITEMS[item])return fail('Unknown item.');if(!Number.isInteger(amount)||amount<1)return fail('Invalid quantity.');if(!costItems(s,{[item]:amount}))return fail('Not enough items to sell.');const revenue=priceAt(s,item,now)*amount;s.coins+=revenue;s.stats.sell+=amount;s.stats.earned+=revenue;earnXp(s,Math.max(1,Math.round(amount/2)));return ok(`Sold ${amount} ${ITEMS[item].name} for ${revenue} coins!`,{coins:revenue});}
export function buySeed(s,item,amount=1,now=Date.now()){if(!CROPS[item])return fail('Only seeds can be purchased.');if(s.level<CROPS[item].level)return fail(`Unlock at level ${CROPS[item].level}.`);const cost=Math.max(2,Math.ceil(priceAt(s,item,now)*.65))*amount;if(s.coins<cost)return fail(`Need ${cost} coins.`);if(inventoryCount(s)+amount>s.storage)return fail('Not enough barn space.');s.coins-=cost;s.stats.spent+=cost;addItem(s,item,amount);return ok(`Bought ${amount} ${CROPS[item].name} seeds for ${cost} coins.`);}
export function buyAnimal(s,id){const a=ANIMALS[id],owned=s.animals[id];if(!a||!owned)return fail('Unknown animal.');if(owned.owned)return fail('Already unlocked.');if(s.level<a.level)return fail(`Unlock at level ${a.level}.`);if(s.coins<a.cost)return fail(`Need ${a.cost} coins.`);s.coins-=a.cost;s.stats.spent+=a.cost;owned.owned=true;return ok(`${a.emoji} ${a.name} joined your farm!`)}
export function feedAnimal(s,id,now=Date.now()){const a=ANIMALS[id],owned=s.animals[id];if(!a||!owned?.owned)return fail('This animal is locked.');if(owned.readyAt)return fail(owned.readyAt>now?'Already fed and producing!':'Collect their product first.');if(!costItems(s,{feed:1}))return fail('Out of animal feed! Craft more at the Feed Mill.');owned.readyAt=now+Math.max(18000,a.time*(1-(owned.level-1)*.14));owned.fedAt=now;s.stats.feed++;return ok(`${a.emoji} Fed ${a.name.toLowerCase()}! Come back for ${ITEMS[a.product].name.toLowerCase()}.`)}
export function collectAnimal(s,id,now=Date.now()){const a=ANIMALS[id],owned=s.animals[id];if(!owned?.owned)return fail('Animal not unlocked.');if(!owned.readyAt)return fail('Feed this animal to begin producing.');if(now<owned.readyAt)return fail(`Come back in ${fmtTime(owned.readyAt-now)}.`);const qty=a.quantity+Math.floor((owned.level-1)/2);if(!addItem(s,a.product,qty))return fail('Barn full! Clear a little space first.');owned.readyAt=0;owned.fedAt=0;s.stats.collect+=qty;const xp=11*qty,levelUps=earnXp(s,xp);return ok(`${a.emoji} Collected ${qty} ${ITEMS[a.product].name}! +${xp} XP`,{xp,levelUps});}
export function rushAnimal(s,id,now=Date.now()){
  const a=s.animals[id];if(!a?.owned||!a.readyAt)return fail('Feed this animal first.');if(a.readyAt<=now)return fail('Already ready!');if(s.gems<1)return fail('Not enough gems.');s.gems--;a.readyAt=now;return ok('⚡ Animal product is ready! 1 gem used.');
}
export function upgradeAnimal(s,id){const own=s.animals[id];if(!own?.owned)return fail('Unlock animal first.');if(own.level>=5)return fail('Shelter is fully upgraded!');const cost=170*own.level;if(s.coins<cost)return fail(`Need ${cost} coins.`);s.coins-=cost;s.stats.spent+=cost;own.level++;return ok(`Animal shelter upgraded to Lv. ${own.level}!`)}
export function startCraft(s,buildingId,recipeId,now=Date.now()){
  const b=s.buildings.find(b=>b.id===buildingId),r=RECIPES[recipeId];if(!b||!r||r.building!==b.type)return fail('Recipe unavailable at this building.');if(s.level<r.level)return fail(`Recipe unlocks at level ${r.level}.`);

}
export function collectCraft(s,buildingId,now=Date.now()){
  const b=s.buildings.find(b=>b.id===buildingId);if(!b||!b.queue.length)return fail('Nothing in the queue.');const q=b.queue[0];if(q.endsAt>now)return fail(`Ready in ${fmtTime(q.endsAt-now)}.`);const r=RECIPES[q.recipe];if(!addItem(s,q.recipe,r.output))return fail('Your barn is full!');b.queue.shift();const xp=16*r.output,levelUps=earnXp(s,xp);return ok(`+${r.output} ${PRODUCTS[q.recipe].name} · +${xp} XP`,{xp,levelUps});

export function rushFactory(s,id,now=Date.now()){

export function buildFactory(s,id,x,z){const f=FACTORIES[id];if(!f)return fail('Unknown factory.');if(s.buildings.some(b=>b.type===id))return fail('This factory is already built.');if(s.level<f.level)return fail(`Unlock at level ${f.level}.`);if(s.coins<f.cost)return fail(`Need ${f.cost} coins.`);s.coins-=f.cost;s.stats.spent+=f.cost;s.buildings.push({id,type:id,x,z,rotation:0,level:1,queue:[]});return ok(`${f.emoji} ${f.name} built!`);}

export function makeOrder(s,kind='truck',salt=0){
  const pool=Object.keys(ITEMS).filter(id=>{if(CROPS[id])return CROPS[id].level<=s.level;if(RECIPES[id])return RECIPES[id].level<=s.level&&s.buildings.some(b=>b.type===RECIPES[id].building);return Object.values(ANIMALS).some((a,i)=>a.product===id&&s.animals[Object.keys(ANIMALS)[i]].owned)});
  const shuffled=pool.sort((a,b)=>((a.charCodeAt(0)*13+salt*37)%17)-((b.charCodeAt(0)*13+salt*37)%17));const desired=kind==='boat'?2:kind==='truck'?2:1;const items={};for(const item of shuffled.slice(salt%Math.max(1,shuffled.length),salt%Math.max(1,shuffled.length)+desired))items[item]=CROPS[item]?2+salt%2:1;if(!Object.keys(items).length)items.wheat=3;

export function dailyTasks(s){return [
  {id:'plant',title:'Sow the seeds',current:s.stats.plant-(s.questBaseline?.plant||0),target:6,emoji:'🌱',reward:55,xp:20},
  {id:'harvest',title:'Bountiful harvest',current:s.stats.harvest-(s.questBaseline?.harvest||0),target:15,emoji:'🌾',reward:75,xp:25},
  {id:'orders',title:'Happy customers',current:s.stats.orders-(s.questBaseline?.orders||0),target:2,emoji:'📦',reward:95,xp:35},
  {id:'collect',title:'Animal friends',current:s.stats.collect-(s.questBaseline?.collect||0),target:4,emoji:'🥚',reward:70,xp:22}
]}
export function claimTask(s,id){const q=dailyTasks(s).find(q=>q.id===id);if(!q)return fail('Unknown quest.');if(s.daily.questsClaimed.includes(id))return fail('Already claimed.');if(q.current<q.target)return fail('Quest still in progress.');s.daily.questsClaimed.push(id);s.coins+=q.reward;earnXp(s,q.xp);return ok(`✦ Quest complete! +${q.reward} coins and ${q.xp} XP.`)}
export const localDay=now=>new Date(now).toLocaleDateString('en-CA');
export function refreshDay(s,now=Date.now()){const day=localDay(now);if(s.daily.day!==day){s.daily={day,claimed:false,questsClaimed:[]};s.questBaseline={...s.stats};}const month=day.slice(0,7);if(!s.events||s.events.month!==month)s.events={month,baseline:{...s.stats},claimed:false};}
export function claimDaily(s,now=Date.now()){refreshDay(s,now);if(s.daily.claimed)return fail('Daily gift already collected. Come back tomorrow!');s.daily.claimed=true;s.coins+=100;s.gems+=1;earnXp(s,22);return ok('🎁 Daily gift: +100 coins, +1 gem, +22 XP!')}
export function seasonalGoal(s,now=Date.now()) {
  const month=new Date(now).getMonth(),name=month>=8&&month<=10?'Harvest Moon Festival':month<=1||month===11?'Winter Hearth Festival':month>=2&&month<=4?'Spring Bloom Festival':'Summer Sunshine Fair';
  const emoji=month>=8&&month<=10?'🎃':month<=1||month===11?'❄️':month>=2&&month<=4?'🌸':'🌻';
  const target=30,current=Math.max(0,s.stats.harvest-(s.events?.baseline?.harvest||0));
  return{name,emoji,target,current,claimed:!!s.events?.claimed,coins:350,xp:95};
}
export function claimSeasonal(s,now=Date.now()){
  refreshDay(s,now);const q=seasonalGoal(s,now);if(q.claimed)return fail('Festival prize already collected this month.');if(q.current<q.target)return fail(`Harvest ${q.target-q.current} more items to finish the festival.`);
  s.events.claimed=true;s.coins+=q.coins;earnXp(s,q.xp);return ok(`${q.emoji} ${q.name} complete! +${q.coins} coins and +${q.xp} XP.`);
}
export function tick(s,now=Date.now()){ 
  refreshDay(s,now);let changed=false;
  if(now>=s.weather.nextAt){const types=['sunny','sunny','cloudy','rainy','windy'];const type=types[Math.floor(Math.random()*types.length)];s.weather={type,changedAt:now,nextAt:now+125000+Math.random()*120000};changed=true;
    if(type==='rainy'){for(const p of s.plots)if(p.crop&&!p.watered&&growFraction(p,now)<1){const rest=p.plantedAt+p.duration-now;p.plantedAt-=rest*.22;p.watered=true;}}
  }
  return changed;
}
export function weatherName(type){return({sunny:'Sunny skies',cloudy:'Partly cloudy',rainy:'Gentle rain',windy:'Breezy afternoon'})[type]||'Sunny skies'}
export function gameHour(s,now=Date.now()){const elapsed=(now-s.dayStart)/1000;return ((7+elapsed/23)%24+24)%24}
export function gameDay(s,now=Date.now()){return Math.floor(Math.max(0,now-s.dayStart)/1000/552)+1}
export function clockText(s,now=Date.now()){let h=gameHour(s,now),hours=Math.floor(h),minutes=Math.floor(h%1*60/5)*5;return `Day ${gameDay(s,now)} · ${hours%12||12}:${String(minutes).padStart(2,'0')} ${hours>=12?'PM':'AM'}`}
export function validateSave(s){return Boolean(s&&s.version===VERSION&&Array.isArray(s.plots)&&s.plots.length===24&&s.inventory&&s.stats&&Array.isArray(s.buildings))}

function toast(msg,success=true){const el=document.createElement('div');el.className='toast';el.textContent=msg;$('#toasts').append(el);setTimeout(()=>el.remove(),3300);playTone(success?'success':'tap')}

function worldPick(ev){const pos=ev.position||{x:0,z:0};if(placement||moving){const info=placement||moving;const x=Math.max(-21,Math.min(21,Math.round(pos.x*2)/2)),z=Math.max(-19,Math.min(19,Math.round(pos.z*2)/2));if(!validPosition(x,z,info.type,info.kind,info.id)){toast('Choose an open grassy spot away from fields and buildings.',false);return}
  if(moving){const obj=info.kind==='building'?state.buildings.find(b=>b.id===info.id):state.decorations.find(d=>d.id===info.id);if(obj){obj.x=x;obj.z=z;world.sync(state);toast('✥ Moved into place!');}moving=null;setTool('inspect');}
  else {let r=info.kind==='factory'?buildFactory(state,info.type,x,z):buyDecoration(state,info.type,x,z);applyResult(r,{rebuild:r.ok});placement=null;setTool('inspect')}persist();return;}
 if(ev.kind==='plot'){const p=state.plots[ev.id];if(tool==='plant')applyResult(plant(state,ev.id,state.selectedCrop),{pop:'🌱',x:ev.clientX,y:ev.clientY});else if(tool==='water')applyResult(water(state,ev.id),{pop:'💧',x:ev.clientX,y:ev.clientY});else if(tool==='fertilize')applyResult(fertilize(state,ev.id),{pop:'✨',x:ev.clientX,y:ev.clientY});else if(tool==='harvest')applyResult(harvest(state,ev.id),{pop:'🌾',x:ev.clientX,y:ev.clientY});else if(tool==='inspect')showPlot(p);else if(tool==='move')toast('Fields stay in their lovely garden beds.',false);return;}
 if(tool==='move'&&['building','decor'].includes(ev.kind)){moving={kind:ev.kind,id:ev.id,type:ev.kind==='building'?state.buildings.find(b=>b.id===ev.id)?.type:state.decorations.find(d=>d.id===ev.id)?.type};modal({emoji:'✥',title:'Move & rotate',body:'Close this message, then tap an open grassy spot to move your selection. Press R to rotate, or tap the Rotate button.',buttons:[{title:'Rotate ↻',action:'rotate-move'},{title:'Place it!',action:'close-modal'}]});return;}
 if(ev.kind==='npc')toast('👩‍🌾 Welcome, neighbor! The delivery board has today’s requests.');else if(ev.kind==='building')openPanel('factory',ev.id);else if(ev.kind==='animal'){if(state.animals[ev.id]?.owned)openPanel('animal',ev.id)}else if(ev.kind==='decor')toast(`${DECOR[state.decorations.find(d=>d.id===ev.id)?.type]?.name||'Decoration'} · Looking lovely!`);
}
function validPosition(x,z,type,kind,ignoreId){if(Math.abs(x)>21||Math.abs(z)>19)return false;if(x>-8&&x<10&&z>-10&&z<3)return false;if(x>-4.6&&x<3.5&&z>9&&z<17)return false;if(x>14&&z>9)return false;if(x<-14&&z<-7)return false;
 const radius=kind==='factory'?3.1:type==='pond'?2:1;for(const b of state.buildings){if(b.id===ignoreId)continue;if(Math.hypot(x-b.x,z-b.z)<radius+2.1)return false}for(const [id,a] of Object.entries(ANIMALS))if(state.animals[id].owned&&Math.hypot(x-a.pos[0],z-a.pos[1])<radius+2.2)return false;return true}
function place(kind,type){placement={kind,type};moving=null;closePanel();tool='place';document.querySelectorAll('.tool').forEach(b=>b.classList.remove('selected'));$('#bottom-hint').textContent=`Tap open grass to place ${kind==='factory'?FACTORIES[type]?.name:DECOR[type]?.name} · Esc to cancel`;toast('Tap an open grassy spot in the 3D farm to place it!');}
function action(name,el){const id=el.dataset.id, item=el.dataset.item, count=Number(el.dataset.count)||1, value=el.dataset.value;switch(name){
case 'close-modal':closeModal();return;
case 'tab':tab=value;refreshPanel();return;
case 'sell':applyResult(sell(state,item,count));return;
case 'buy-seed':applyResult(buySeed(state,item,count));return;
case 'deliver':applyResult(deliverOrder(state,id));return;
case 'buy-animal':applyResult(buyAnimal(state,id),{rebuild:true});return;
case 'animal-open':openPanel('animal',id);return;
case 'feed-animal':applyResult(feedAnimal(state,id));return;
case 'collect-animal':applyResult(collectAnimal(state,id));return;
case 'upgrade-animal':applyResult(upgradeAnimal(state,id));return;
case 'open-factory':openPanel('factory',id);return;
case 'place-factory':place('factory',id);return;
case 'place-decor':place('decor',id);return;
case 'craft':applyResult(startCraft(state,el.dataset.building,id));return;
case 'collect-craft':applyResult(collectCraft(state,id));return;
case 'upgrade-factory':applyResult(upgradeFactory(state,id));return;
case 'upgrade-storage':applyResult(upgradeStorage(state));return;
case 'claim-quest':applyResult(claimTask(state,id));return;
case 'seasonal':applyResult(claimSeasonal(state));return;
case 'open-quests':openPanel('quests');return;
case 'buy-plot':closeModal();applyResult(buyPlot(state,Number(value)),{rebuild:true});return;
case 'quick-plant':closeModal();setTool('plant');toast('Choose a seed above, then tap the field!');return;
case 'quick-harvest':closeModal();applyResult(harvest(state,Number(value)));return;
case 'quick-water':closeModal();applyResult(water(state,Number(value)));return;
case 'rush-plot':closeModal();applyResult(rushPlot(state,Number(value)));return;
case 'rush-animal':applyResult(rushAnimal(state,id));return;
case 'rush-factory':applyResult(rushFactory(state,id));return;
case 'quick-boost':closeModal();applyResult(fertilize(state,Number(value)));return;
case 'rotate-move':if(moving){const obj=moving.kind==='building'?state.buildings.find(b=>b.id===moving.id):state.decorations.find(d=>d.id===moving.id);if(obj){obj.rotation=(obj.rotation+Math.PI/2)%(Math.PI*2);world.sync(state);persist();toast('Rotated 90°!')}}closeModal();return;
case 'rename-save':{const text=$('#farm-rename-input')?.value?.trim().slice(0,24);if(text){state.name=text;persist();updateHud();toast('Farm renamed!')}closeModal();return}
case 'daily':closeModal();applyResult(claimDaily(state));return;
case 'save':persist();toast('💾 Progress saved!');return;
case 'export':{persist();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sunmeadow-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save backup exported!');return;}
case 'import':{$('#import-save-input')?.click();return}
case 'reset-confirm':modal({emoji:'🌱',title:'Start over?',body:'This permanently resets the current farm on this browser. Export a backup in Settings first if you want to keep it.',buttons:[{title:'Keep my farm',action:'close-modal',alt:true},{title:'Reset everything',action:'reset'}]});return;
case 'reset':{closeModal();state=createGame();persist();world.sync(state);world.home();lastLevel=1;setTool('inspect');closePanel();updateHud();toast('Welcome to a brand new farm!');return}
case 'tutorial-close':state.tutorial=1;persist();closeModal();setTool('plant');toast('🌱 Pick wheat from the seed tray and tap a field!');return;
case 'tour-skip':state.tutorial=5;persist();closeModal();return;
}}
function minimap(){const c=$('#minimap canvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,120,92);ctx.fillStyle='#8fc67e';ctx.fillRect(0,0,120,92);ctx.fillStyle='#dacc9e';ctx.fillRect(7,4,106,83);ctx.fillStyle='#b3d485';ctx.fillRect(9,6,102,79);const pt=(x,z)=>[60+x*2.1,45+z*1.65];for(const p of state.plots){const [x,y]=pt(p.x,p.z);ctx.fillStyle=p.crop?'#b98851':p.unlocked?'#855b3f':'#a6bd83';ctx.fillRect(x-2.2,y-1.6,4.5,3.2);if(p.crop&&growFraction(p)>=1){ctx.fillStyle='#ffe37b';ctx.fillRect(x-1,y-1,2,2)}}for(const b of state.buildings){const [x,y]=pt(b.x,b.z);ctx.fillStyle='#ce8c5a';ctx.fillRect(x-3,y-3,6,6)}ctx.fillStyle='#65aec7';ctx.beginPath();ctx.ellipse(...pt(-18,-11),6,4,0,0,Math.PI*2);ctx.fill();for(const [id,a] of Object.entries(ANIMALS))if(state.animals[id].owned){let [x,y]=pt(...a.pos);ctx.fillStyle='#f6f2db';ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill()}}
function startup(){try{world=new FarmWorld($('#game'),state,worldPick);$('#startup').classList.add('hide');setTimeout(()=>$('#startup').remove(),680);setTool('inspect');updateHud();minimap();if(!state.tutorial)setTimeout(()=>modal({emoji:'🌻',title:'Welcome to Sunmeadow Valley!',body:'Your very own little patch of happiness! Plant crops, feed the animals, bake delicious treats, and build the coziest farm in the valley.<br><br><strong>First adventure:</strong> Select Plant, choose wheat, then tap an empty field.',buttons:[{title:'Let’s start growing!',action:'tutorial-close'},{title:'I know my way around',action:'tour-skip',alt:true}]}),500)}catch(error){console.error(error);$('#startup-error').textContent='The 3D engine could not start. Please use a modern browser with WebGL enabled.'}}
function initEvents(){document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.action){action(target.dataset.action,target);return}if(target.dataset.panel){openPanel(target.dataset.panel);return}if(target.dataset.tool){setTool(target.dataset.tool);return}if(target.dataset.crop){state.selectedCrop=target.dataset.crop;persist();updateTray();toast(`${CROPS[state.selectedCrop].emoji} ${CROPS[state.selectedCrop].name} selected`);return}});
 $('#panel-close').addEventListener('click',closePanel);$('#panel-backdrop').addEventListener('click',closePanel);$('#settings-btn').addEventListener('click',()=>openPanel('settings'));$('#quests-more').addEventListener('click',()=>openPanel('quests'));$('#home-camera').addEventListener('click',()=>world?.home());$('#zoom-in').addEventListener('click',()=>world?.zoom(.85));$('#zoom-out').addEventListener('click',()=>world?.zoom(1.15));$('#gift-button').addEventListener('click',()=>modal({emoji:'🎁',title:state.daily.claimed?'Come back tomorrow!':'A little gift for you',body:state.daily.claimed?'Your daily gift has already been collected. Keep farming!':'Claim your daily surprise: <strong>100 coins, 1 gem, and 22 experience points</strong>.',buttons:state.daily.claimed?[{title:'Okay',action:'close-modal'}]:[{title:'Collect gift!',action:'daily'},{title:'Later',action:'close-modal',alt:true}]}));$('#edit-title').addEventListener('click',()=>modal({emoji:'🏡',title:'Name your dream farm',body:'Every beautiful valley needs a beautiful name.',extra:`<input class="text-field" id="farm-rename-input" maxlength="24" value="${esc(state.name)}" aria-label="Farm name">`,buttons:[{title:'Save farm name',action:'rename-save'},{title:'Cancel',action:'close-modal',alt:true}]}));
 document.addEventListener('change',e=>{const target=e.target;if(target.dataset.setting){const k=target.dataset.setting;state.settings[k]=target.type==='checkbox'?target.checked:target.value;persist();if(k==='quality')world?.resize();toast('Settings saved!')}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePanel();if(placement||moving)setTool('inspect')}if(e.key.toLowerCase()==='r'&&moving){action('rotate-move',document.createElement('button'))}if(e.key>='1'&&e.key<='6'&&!e.target.closest('input')){setTool(['inspect','plant','water','fertilize','harvest','move'][Number(e.key)-1])}});
 $('#modal-root').addEventListener('click',e=>{if(e.target.classList.contains('modal-shade'))closeModal()});const importInput=document.createElement('input');importInput.type='file';importInput.accept='application/json,.json';importInput.id='import-save-input';importInput.style.display='none';document.body.append(importInput);importInput.addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!validateSave(parsed))throw new Error('Invalid save data');state=parsed;refreshDay(state);persist();world.sync(state);world.home();updateHud();closePanel();toast('✅ Farm restored from backup!')}catch{toast('Could not restore this save file.',false)}importInput.value='' });
 document.addEventListener('visibilitychange',()=>{if(document.hidden)persist();else{updateHud();refreshPanel()}});window.addEventListener('pagehide',persist);setInterval(()=>{if(tick(state))persist();updateHud();if(activePanel&&activePanel!=='settings')refreshPanel()},2500);setInterval(()=>{persist();minimap()},11000);
}
initEvents();startup();setInterval(ambientChirp,18000);


</script>
